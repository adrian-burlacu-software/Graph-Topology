<aside><h1>V682 ontology</h1><p class="hint">Actual canonical facts and on-demand derivations.</p>

const graph={"nodes": [{"id": "animal", "kind": "type"}, {"id": "dog", "kind": "entity"}, {"id": "living", "kind": "property"}, {"id": "mammal", "kind": "type"}, {"id": "mineral", "kind": "type"}, {"id": "organism", "kind": "type"}, {"id": "physical_object", "kind": "type"}, {"id": "plant", "kind": "type"}, {"id": "vertebrate", "kind": "type"}, {"id": "warm_blooded", "kind": "property"}], "edges": [{"subject": "animal", "relation": "is_a", "object": "organism", "kind": "DIRECT", "proof": {"fact": {"subject": "animal", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}}, {"subject": "dog", "relation": "has_property", "object": "living", "kind": "INFERRED", "proof": {"fact": {"subject": "dog", "relation": "has_property", "object": "living"}, "kind": "INFERRED", "proof_depth": 3, "rule": "type + has_property -> has_property", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "organism"}, "kind": "INFERRED", "proof_depth": 2, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "vertebrate"}, "kind": "INFERRED", "proof_depth": 1, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}, {"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}]}, {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "organism"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}, {"fact": {"subject": "animal", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}]}]}, {"fact": {"subject": "organism", "relation": "has_property", "object": "living"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "has_property"}]}}, {"subject": "dog", "relation": "has_property", "object": "warm_blooded", "kind": "INFERRED", "proof": {"fact": {"subject": "dog", "relation": "has_property", "object": "warm_blooded"}, "kind": "INFERRED", "proof_depth": 1, "rule": "type + has_property -> has_property", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}, {"fact": {"subject": "mammal", "relation": "has_property", "object": "warm_blooded"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "has_attribute"}]}}, {"subject": "dog", "relation": "type", "object": "animal", "kind": "INFERRED", "proof": {"fact": {"subject": "dog", "relation": "type", "object": "animal"}, "kind": "INFERRED", "proof_depth": 2, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}, {"fact": {"subject": "mammal", "relation": "is_a", "object": "animal"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}, {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}]}]}}, {"subject": "dog", "relation": "type", "object": "mammal", "kind": "DIRECT", "proof": {"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}}, {"subject": "dog", "relation": "type", "object": "organism", "kind": "INFERRED", "proof": {"fact": {"subject": "dog", "relation": "type", "object": "organism"}, "kind": "INFERRED", "proof_depth": 2, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "vertebrate"}, "kind": "INFERRED", "proof_depth": 1, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}, {"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}]}, {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "organism"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}, {"fact": {"subject": "animal", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}]}]}}, {"subject": "dog", "relation": "type", "object": "vertebrate", "kind": "INFERRED", "proof": {"fact": {"subject": "dog", "relation": "type", "object": "vertebrate"}, "kind": "INFERRED", "proof_depth": 1, "rule": "type + is_a -> type", "premises": [{"fact": {"subject": "dog", "relation": "type", "object": "mammal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "instance_of"}, {"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}]}}, {"subject": "mammal", "relation": "has_property", "object": "warm_blooded", "kind": "DIRECT", "proof": {"fact": {"subject": "mammal", "relation": "has_property", "object": "warm_blooded"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "has_attribute"}}, {"subject": "mammal", "relation": "is_a", "object": "animal", "kind": "INFERRED", "proof": {"fact": {"subject": "mammal", "relation": "is_a", "object": "animal"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}, {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}]}}, {"subject": "mammal", "relation": "is_a", "object": "organism", "kind": "INFERRED", "proof": {"fact": {"subject": "mammal", "relation": "is_a", "object": "organism"}, "kind": "INFERRED", "proof_depth": 2, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "mammal", "relation": "is_a", "object": "animal"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}, {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}]}, {"fact": {"subject": "animal", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}]}}, {"subject": "mammal", "relation": "is_a", "object": "vertebrate", "kind": "DIRECT", "proof": {"fact": {"subject": "mammal", "relation": "is_a", "object": "vertebrate"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "hypernym"}}, {"subject": "mineral", "relation": "is_a", "object": "physical_object", "kind": "DIRECT", "proof": {"fact": {"subject": "mineral", "relation": "is_a", "object": "physical_object"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}}, {"subject": "organism", "relation": "has_property", "object": "living", "kind": "DIRECT", "proof": {"fact": {"subject": "organism", "relation": "has_property", "object": "living"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "has_property"}}, {"subject": "plant", "relation": "is_a", "object": "organism", "kind": "DIRECT", "proof": {"fact": {"subject": "plant", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}}, {"subject": "vertebrate", "relation": "is_a", "object": "animal", "kind": "DIRECT", "proof": {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}}, {"subject": "vertebrate", "relation": "is_a", "object": "organism", "kind": "INFERRED", "proof": {"fact": {"subject": "vertebrate", "relation": "is_a", "object": "organism"}, "kind": "INFERRED", "proof_depth": 1, "rule": "is_a + is_a -> is_a", "premises": [{"fact": {"subject": "vertebrate", "relation": "is_a", "object": "animal"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "subclass_of"}, {"fact": {"subject": "animal", "relation": "is_a", "object": "organism"}, "kind": "DIRECT", "proof_depth": 0, "source_relation": "is_a"}]}}]}, svg=document.querySelector('#graph'), detail=document.querySelector('#detail'), focus=document.querySelector('#focus');
for(const n of graph.nodes) focus.add(new Option(n.id,n.id));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const proof=p=>p.kind==='DIRECT' ? `DIRECT\n${p.fact.subject} --${p.fact.relation}--> ${p.fact.object}` :
  p.premises.map(proof).join('\n+\n')+`\n+\nrule: ${p.rule}\ntherefore ${p.fact.subject} --${p.fact.relation}--> ${p.fact.object} [INFERRED]`;
function render(){
  const chosen=focus.value, edges=chosen?graph.edges.filter(e=>e.subject===chosen||e.object===chosen):graph.edges;
  const ids=[...new Set(edges.flatMap(e=>[e.subject,e.object]))], nodes=graph.nodes.filter(n=>ids.includes(n.id));
  const positions=Object.fromEntries(nodes.map((n,i)=>[n.id,{x:110+(i%4)*235,y:105+Math.floor(i/4)*145}]));
  svg.replaceChildren(); const ns='http://www.w3.org/2000/svg';
  const add=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;svg.append(e);return e;};
  for(const edge of edges){const a=positions[edge.subject],b=positions[edge.object];if(!a||!b)continue;
    const line=add('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge '+edge.kind.toLowerCase()});line.style.cursor='pointer';
    line.onclick=()=>detail.innerHTML='<h1>'+edge.kind+'</h1><pre>'+esc(proof(edge.proof))+'</pre>';
    add('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,class:'edge-label'},edge.relation);
  }
  for(const node of nodes){const p=positions[node.id];add('circle',{cx:p.x,cy:p.y,r:34,class:'node '+node.kind});add('text',{x:p.x,y:p.y+4,'text-anchor':'middle',class:'label'},node.id);}
  if(chosen) detail.innerHTML='<h1>Focused: '+esc(chosen)+'</h1><p>'+edges.length+' local relationship(s). Click an edge for evidence.</p>';
}
focus.onchange=render;render();
</script></body></html>
