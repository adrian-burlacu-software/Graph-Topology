<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V697 — everything a turn did</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a21; --panel2: #1a2029; --line: #262e39;
    --text: #d9e0e8; --muted: #8a96a6; --faint: #5d6877;
    --accent: #b48cff; --rule: #7cc4ff; --warm: #e0a84a;
    --yes: #3fb27f; --no: #e5534b; --unknown: #768390; --noted: #4c9be8;
    --which: #d9a33a; --value: #a8b3bf; --social: #c77dff; --refused: #9f6b53;
    --subj: #5aa9ff; --claim: #b48cff; --neg: #ff6b6b; --val: #4fd18b;
    --quote: #e0a84a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               sans-serif; }
  button { font: inherit; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
           padding: 12px 22px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--muted); }
  header nav { margin-left: auto; display: flex; gap: 14px; }
  header nav a { color: var(--accent); text-decoration: none; }
  main { --pane: 42%; display: grid;
         grid-template-columns: minmax(0, 1fr) var(--pane) 46px;
         height: calc(100vh - 50px); }
  main.closed { grid-template-columns: minmax(0, 1fr) 0 46px; }
  main.closed aside { display: none; }
  main.dragging { user-select: none; cursor: col-resize; }
  /* the rail: open the pane on a tab, close it, and size it */
  #rail { grid-column: 3; grid-row: 1;
          display: flex; flex-direction: column; align-items: center; gap: 4px;
          padding: 10px 0; background: var(--panel);
          border-left: 1px solid var(--line); }
  #rail button { width: 34px; height: 34px; display: grid; place-items: center;
                 background: none; color: var(--muted);
                 border: 1px solid transparent; border-radius: 8px;
                 cursor: pointer; font-size: 15px; padding: 0; }
  #rail button:hover:not(:disabled) { color: var(--text);
         border-color: var(--line); background: var(--panel2); }
  #rail button.on { color: var(--accent); border-color: var(--accent);
                    background: #211b30; }
  #rail button:disabled { opacity: .35; cursor: default; }
  #rail .gap { flex: 1; }
  #rail .sep { width: 22px; border-top: 1px solid var(--line); margin: 4px 0; }
  #rail .pct { color: var(--faint); font-size: 10.5px; }
  #grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
          cursor: col-resize; z-index: 2; }
  #grip:hover, main.dragging #grip { background: linear-gradient(90deg,
          transparent 3px, var(--accent) 3px, var(--accent) 5px,
          transparent 5px); }
  @media (max-width: 1000px) {
    main, main.closed { grid-template-columns: 1fr; height: auto; }
    main.closed aside { display: flex; }
    #rail, #grip { display: none; }
    #talk { height: auto !important; }
  }
  #talk { display: flex; flex-direction: column; min-width: 0;
          border-right: 1px solid var(--line); height: calc(100vh - 50px); }
  .examples { padding: 12px 22px 8px; border-bottom: 1px solid var(--line); }
  .examples .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button, .quiet { background: var(--panel2); color: var(--text);
         border: 1px solid var(--line); border-radius: 999px;
         padding: 4px 11px; cursor: pointer; }
  .examples button:hover, .quiet:hover { border-color: var(--accent); }
  .shows { color: var(--muted); margin-top: 8px; font-size: 13px; }
  .mode { color: var(--muted); font-size: 12px; margin-top: 6px;
          display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mode b { color: var(--text); font-weight: 600; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px 22px;
                display: flex; flex-direction: column; gap: 14px; }
  .you { align-self: flex-end; max-width: 78%; background: #243149;
         border: 1px solid #2f4263; border-radius: 14px 14px 4px 14px;
         padding: 8px 12px; font-size: 15px; overflow-wrap: anywhere; }
  .me { align-self: flex-start; max-width: 92%; min-width: 0;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px 14px 14px 4px; padding: 10px 13px; }
  .me .reply { font-size: 15px; overflow-wrap: anywhere; }
  .me .reply.untraced { color: #f0c9a0; }
  .me .reply.silent { color: var(--muted); font-style: italic; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px;
            align-items: center; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted);
          white-space: nowrap; }
  .stance { color: #0e1116; font-weight: 700; border: 0;
            text-transform: uppercase; letter-spacing: .03em; }
  .s-yes { background: var(--yes); } .s-no { background: var(--no); }
  .s-unknown { background: var(--unknown); } .s-noted { background: var(--noted); }
  .s-which { background: var(--which); } .s-value { background: var(--value); }
  .s-social { background: var(--social); } .s-refused { background: var(--refused); }
  .s-acted { background: var(--accent); }
  .traced { color: var(--yes); border-color: #2c5e47; }
  .untraced-chip { color: var(--warm); border-color: #6b5327; }
  .how { background: none; border: 0; color: var(--accent); cursor: pointer;
         padding: 0; font-size: 12px; margin-left: auto; }
  .pending { color: var(--muted); font-style: italic; }
  .error { color: var(--no); }
  /* the steps */
  .steps { margin: 10px 0 2px; padding: 0 0 0 4px; list-style: none;
           border-left: 2px solid var(--line); }
  .steps > li { position: relative; padding: 4px 0 8px 16px; }
  .steps > li::before { content: ""; position: absolute; left: -7px; top: 9px;
           width: 12px; height: 12px; border-radius: 50%;
           background: var(--panel); border: 2px solid var(--rule); }
  .steps > li.said::before { border-color: var(--yes); }
  .steps > li.said.bad::before { border-color: var(--warm); }
  .step-name { font-size: 11px; text-transform: uppercase;
               letter-spacing: .08em; color: var(--rule); margin-right: 6px; }
  .step-line { color: var(--text); }
  .step-open { background: none; border: 0; color: var(--faint);
               cursor: pointer; font-size: 12px; padding: 0 0 0 6px; }
  .step-open:hover { color: var(--accent); }
  .detail { margin-top: 6px; background: var(--panel2);
            border: 1px solid var(--line); border-radius: 8px;
            padding: 8px 10px; font-size: 12.5px; overflow-x: auto; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .words { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .word { padding: 1px 6px; border-radius: 5px; background: #202733;
          border: 1px solid var(--line); font-size: 12.5px; }
  .word small { color: var(--muted); margin-left: 4px; font-size: 10.5px; }
  .word.p-SUBJ { border-color: var(--subj); color: var(--subj); }
  .word.p-CLAIM { border-color: var(--claim); color: var(--claim); }
  .word.p-NEG { border-color: var(--neg); color: var(--neg); }
  .word.p-VALUE { border-color: var(--val); color: var(--val); }
  .word.p-QUOTE { border-color: var(--quote); color: var(--quote); }
  .word.sense { cursor: pointer; text-decoration: underline dotted; }
  .bars { display: grid; grid-template-columns: max-content 1fr max-content;
          gap: 3px 8px; align-items: center; }
  .barline { height: 6px; background: var(--line); border-radius: 3px;
             overflow: hidden; }
  .barline i { display: block; height: 100%; background: var(--accent); }
  table.plain { border-collapse: collapse; width: 100%; }
  table.plain td, table.plain th { text-align: left; padding: 2px 6px;
          border-top: 1px solid #222a35; vertical-align: top; }
  table.plain th { color: var(--muted); font-weight: 500; border-top: 0; }
  .ok { color: var(--yes); } .bad { color: var(--warm); } .muted { color: var(--muted); }
  /* v691's plan and its goal stack */
  ol.plan { margin: 4px 0 8px 18px; padding: 0; }
  ol.plan li { margin: 2px 0; }
  details.goal { margin: 2px 0 2px 14px; border-left: 1px solid var(--muted); padding-left: 8px; }
  details.goal > summary { cursor: pointer; list-style: none; }
  details.goal > summary::-webkit-details-marker { display: none; }
  details.goal > summary::before { content: "▸ "; color: var(--muted); }
  details.goal[open] > summary::before { content: "▾ "; }
  .goal-name { font-family: ui-monospace, monospace; font-size: 0.92em; }
  .rule { color: var(--rule); font-weight: 700; font-family: ui-monospace,
          Consolas, monospace; }
  code, .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .candidate { border-top: 1px solid #222a35; padding: 6px 0; }
  .candidate:first-child { border-top: 0; }
  .candidate .text { font-size: 13.5px; }
  .candidate .chosen { color: var(--yes); font-size: 11px; margin-left: 6px; }
  form { display: flex; gap: 8px; padding: 12px 22px 16px;
         border-top: 1px solid var(--line); background: var(--panel); }
  input[type=text] { flex: 1; min-width: 0; background: var(--bg);
         color: var(--text); border: 1px solid var(--line); border-radius: 8px;
         padding: 10px 12px; font: inherit; font-size: 15px; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  form button[type=submit] { background: var(--accent); color: #0e1116;
         border: 0; border-radius: 8px; padding: 0 16px; font-weight: 600;
         cursor: pointer; }
  /* memory */
  aside { display: flex; flex-direction: column; min-width: 0;
          position: relative;
          height: calc(100vh - 50px); background: var(--panel); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: none; border: 0; color: var(--muted);
         padding: 11px 6px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab { flex: 1; overflow-y: auto; padding: 14px 18px; }
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em;
       color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: var(--panel2); border: 1px solid var(--line);
          border-radius: 8px; padding: 6px 10px; min-width: 76px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); font-style: italic; }
  .lane { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .episode { flex: 0 0 230px; background: var(--panel2);
             border: 1px solid var(--line); border-radius: var(--radius);
             padding: 8px 10px; }
  .episode.current { border-color: var(--rule); }
  .episode .head { display: flex; gap: 6px; align-items: baseline;
                   margin-bottom: 4px; }
  .episode .head b { font-size: 13.5px; }
  .occ { list-style: none; margin: 0; padding: 0; }
  .occ li { padding: 5px 0; border-top: 1px solid #222a35; font-size: 12.5px; }
  .occ li:first-child { border-top: 0; }
  .occ .order { color: var(--faint); font-size: 11px; }
  .occ .change { display: block; color: var(--warm); font-size: 11.5px; }
  .occ .state { color: var(--accent); }
  .places { display: grid; grid-template-columns: repeat(auto-fill,
            minmax(150px, 1fr)); gap: 8px; }
  .place { background: var(--panel2); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 7px 9px; }
  .place b { display: block; font-size: 13px; margin-bottom: 3px; }
  .place .who { font-size: 12.5px; }
  .place .with { color: var(--muted); font-size: 11.5px; }
  .card { background: var(--panel2); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; }
  .card.focus { border-color: var(--accent); }
  .card .head { display: flex; gap: 8px; align-items: baseline; }
  .card .head b { font-size: 13.5px; }
  .card .head .id { margin-left: auto; color: var(--faint); font-size: 11px; }
  .salience { height: 3px; background: var(--line); border-radius: 2px;
              margin: 6px 0 4px; overflow: hidden; }
  .salience i { display: block; height: 100%; background: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .facts { list-style: none; margin: 5px 0 0; padding: 0; }
  .facts li { font-size: 12.5px; padding: 2px 0; }
  .facts .said { color: var(--text); }
  .facts .as { color: var(--faint); font-size: 11px; margin-left: 5px; }
  .log { max-height: 240px; overflow-y: auto; font: 11.5px/1.5 ui-monospace,
         Consolas, monospace; color: var(--muted); list-style: none;
         padding: 0; margin: 0; }
  .log b { color: var(--text); font-weight: 600; }
  .tree { list-style: none; margin: 0; padding-left: 14px; }
  .tree > li { margin: 3px 0; }
  .tree .kind { font-weight: 600; }
  .search { display: flex; gap: 6px; margin-bottom: 8px; }
  .search input { flex: 1; background: var(--bg); color: var(--text);
                  border: 1px solid var(--line); border-radius: 6px;
                  padding: 5px 8px; font: inherit; }
  .definition { padding: 5px 0; border-top: 1px solid #222a35; font-size: 12.5px; }
  .definition:first-child { border-top: 0; }
  .senseword { margin-bottom: 12px; }
  .senseword .head { display: flex; gap: 8px; align-items: baseline;
                     margin-bottom: 4px; }
  .senseword .head b { font-size: 14px; }
  .sense { display: grid; grid-template-columns: 18px 1fr; gap: 6px;
           padding: 4px 6px; border-radius: 6px; cursor: pointer;
           border: 1px solid transparent; font-size: 12.5px; }
  .sense:hover { border-color: var(--line); background: var(--panel2); }
  .sense.on { border-color: var(--accent); background: #211b30; }
  .sense .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px;
                border: 2px solid var(--faint); }
  .sense.on .dot { background: var(--accent); border-color: var(--accent); }
  .sense .id { font-family: ui-monospace, Consolas, monospace; color: var(--rule);
               font-size: 11.5px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* -- v697: what is said can be several lines (a request for code) -------- */
  form textarea { flex: 1; min-width: 0; resize: none; background: var(--bg);
         color: var(--text); border: 1px solid var(--line); border-radius: 8px;
         padding: 10px 12px; font: inherit; font-size: 15px; line-height: 1.4;
         max-height: 220px; overflow-y: auto; }
  form textarea:focus { outline: none; border-color: var(--accent); }
  form textarea.code-ish { font-family: ui-monospace, Consolas, monospace;
         font-size: 13.5px; }
  .hint { color: var(--faint); font-size: 11.5px; padding: 0 22px 8px;
          background: var(--panel); }
  .you { white-space: pre-wrap; }
  .you.code-ish { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }

  /* -- code blocks: each in its own little section -------------------------- */
  .codeblock { --code-bg: #0b0e13; margin: 8px 0; border: 1px solid #2b3442;
         border-radius: 10px; overflow: hidden; background: var(--code-bg);
         box-shadow: 0 1px 0 #00000040; }
  .codeblock.answer { border-color: #4b3d73; box-shadow: 0 0 0 1px #4b3d7355; }
  .codeblock.small { margin: 5px 0; }
  .codeblock > header { position: static; display: flex; align-items: center;
         gap: 8px; padding: 5px 6px 5px 10px; background: #141a23;
         border-bottom: 1px solid #222a35; flex-wrap: wrap; z-index: auto; }
  .codeblock .lang { font: 600 10.5px/1 ui-monospace, Consolas, monospace;
         text-transform: uppercase; letter-spacing: .08em; color: #0e1116;
         background: #7cc4ff; border-radius: 4px; padding: 3px 5px; }
  .codeblock .lang.json { background: #e0a84a; }
  .codeblock .title { font: 600 12.5px/1.2 ui-monospace, Consolas, monospace;
         color: var(--text); }
  .codeblock .kind { color: var(--muted); font-size: 11.5px; }
  .codeblock .tools { margin-left: auto; display: flex; gap: 2px; }
  .codeblock .tools button { background: none; border: 1px solid transparent;
         color: var(--muted); border-radius: 6px; padding: 2px 7px;
         font-size: 11.5px; cursor: pointer; white-space: nowrap; }
  .codeblock .tools button:hover { color: var(--text); border-color: var(--line);
         background: #1b2230; }
  .codeblock .tools button.done { color: var(--yes); }
  .codeblock pre { margin: 0; padding: 8px 0; overflow-x: auto;
         font: 12.5px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
         tab-size: 2; counter-reset: line; }
  .codeblock.wrap pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .codeblock pre .l { display: block; padding: 0 12px 0 0; min-height: 1.55em; }
  .codeblock pre .l:hover { background: #ffffff08; }
  .codeblock pre .l::before { counter-increment: line; content: counter(line);
         display: inline-block; width: 3.2em; padding-right: 1em;
         text-align: right; color: #3d4757; user-select: none; }
  .codeblock.folded pre .l:nth-child(n+13) { display: none; }
  .codeblock .more { display: block; width: 100%; text-align: left;
         background: #121821; color: var(--accent); border: 0;
         border-top: 1px dashed #2b3442; padding: 4px 12px; font-size: 11.5px;
         cursor: pointer; }
  .codeblock.closed pre, .codeblock.closed .more { display: none; }
  .tok-k { color: #c792ea; } .tok-s { color: #c3e88d; } .tok-n { color: #f78c6c; }
  .tok-c { color: #5c6a7d; font-style: italic; } .tok-f { color: #82aaff; }
  .tok-t { color: #ffcb6b; } .tok-p { color: #89ddff; } .tok-b { color: #ff9cac; }

  /* -- the code panel: what solving it came to ------------------------------- */
  .panel { border: 1px solid var(--line); border-radius: 10px;
           background: var(--panel2); margin: 8px 0; }
  .panel > summary { cursor: pointer; padding: 7px 10px; list-style: none;
           display: flex; gap: 8px; align-items: baseline; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary::before { content: "▸"; color: var(--muted); }
  .panel[open] > summary::before { content: "▾"; }
  .panel > summary b { font-size: 12.5px; text-transform: uppercase;
           letter-spacing: .07em; color: var(--rule); font-weight: 600; }
  .panel > summary .muted { font-size: 12px; }
  .panel > .inside { padding: 2px 10px 10px; }
  .risks { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
           gap: 6px; margin: 4px 0 8px; }
  .risk { border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px;
          text-align: center; background: var(--panel); }
  .risk b { display: block; font-size: 18px; }
  .risk span { color: var(--muted); font-size: 10.5px; }
  .risk.high { border-color: var(--warm); background: #2a2214; }
  .risk.high b { color: var(--warm); }
  .chip.on { color: var(--accent); border-color: #4b3d73; }
  .chip.good { color: var(--yes); border-color: #2c5e47; }
  .chip.warn { color: var(--warm); border-color: #6b5327; }
  .chip.badc { color: var(--no); border-color: #6b2f2b; }
  .events { list-style: none; margin: 4px 0; padding: 0;
            font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .events li { padding: 2px 0; border-top: 1px solid #1f2630;
               overflow-wrap: anywhere; }
  .events .at { color: var(--faint); display: inline-block; min-width: 5.5em; }
  .events .ev { color: var(--rule); margin-right: 6px; }
  .writer { margin: 6px 0 10px; }
  .writer > .head { font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }

  /* -- everything: the inspector tab ---------------------------------------- */
  .graph { width: 100%; height: 340px; background: #0b0e13;
           border: 1px solid var(--line); border-radius: 8px; display: block; }
  .graph text { font: 11px ui-sans-serif, system-ui, sans-serif; fill: var(--text); }
  .graph .edge-label { fill: var(--muted); font-size: 9.5px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px;
            color: var(--muted); margin: 6px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
              margin-right: 4px; vertical-align: -1px; }
  .jtree { font: 12px/1.55 ui-monospace, Consolas, monospace; }
  .jtree details { margin-left: 12px; }
  .jtree summary { cursor: pointer; color: var(--muted); }
  .jtree .k { color: #82aaff; } .jtree .v-s { color: #c3e88d; }
  .jtree .v-n { color: #f78c6c; } .jtree .v-b { color: #c792ea; }
  .jtree .leaf { margin-left: 12px; overflow-wrap: anywhere; }
  .jtree .hit { background: #4b3d73; border-radius: 3px; }
  .jtree .hidden { display: none; }
  .turnpick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .turnpick button { background: var(--panel2); color: var(--muted);
         border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
         cursor: pointer; font-size: 12px; }
  .turnpick button.on { color: var(--text); border-color: var(--accent); }
  /* what to ask next: chips that say it, or put it in the box to finish */
  .next { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .next button { background: var(--panel2); color: var(--rule);
         border: 1px solid #2a3a4d; border-radius: 999px; padding: 2px 10px;
         font-size: 12px; cursor: pointer; }
  .next button.fill { color: var(--warm); border-style: dashed; }
  .next button:hover { border-color: var(--accent); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>V697</h1>
  <span class="sub">everything a turn did — from the semantic graph to the
    searches to the results, code included: open any turn's
    <b>everything</b></span>
  <nav><a href="/v690">v690</a><a href="/v689">v689</a><a href="/v688">v688</a></nav>
</header>
<main>
  <section id="talk">
    <div class="examples">
      <div class="row" id="examples"></div>
      <div class="shows" id="shows"></div>
      <div class="mode" id="mode"></div>
    </div>
    <div id="transcript"></div>
    <form id="say">
      <textarea id="line" rows="1" autocomplete="off" spellcheck="false"
             placeholder="hello · there is a beagle · can it swim · or ask for a function: sum a list — total([1,2,3]) == 6, total([]) == 0"></textarea>
      <button type="submit">say</button>
      <button type="button" class="quiet" id="forget">start over</button>
    </form>
    <div class="hint">Enter says it · Shift+Enter for a new line (a signature, an example per line)</div>
  </section>
  <aside>
    <div id="grip" title="drag to resize"></div>
    <div class="tabs">
      <button data-tab="episodic" class="on">episodic memory</button>
      <button data-tab="longterm">long-term memory</button>
      <button data-tab="senses">senses</button>
      <button data-tab="everything">everything</button>
    </div>
    <div class="tab" id="tab-episodic"></div>
    <div class="tab" id="tab-longterm" hidden></div>
    <div class="tab" id="tab-senses" hidden></div>
    <div class="tab" id="tab-everything" hidden></div>
  </aside>
  <nav id="rail" aria-label="memory pane">
    <button type="button" data-open="episodic" title="episodic memory">&#9719;</button>
    <button type="button" data-open="longterm" title="long-term memory">&#9635;</button>
    <button type="button" data-open="senses" title="senses">&#9672;</button>
    <button type="button" data-open="everything" title="everything a turn did">&#9881;</button>
    <div class="sep"></div>
    <button type="button" id="wider" title="wider">&#8676;</button>
    <span class="pct" id="pct"></span>
    <button type="button" id="narrower" title="narrower">&#8677;</button>
    <div class="gap"></div>
    <button type="button" id="toggle" title="close the pane">&#8250;</button>
  </nav>
</main>
<script>
"use strict";
function makeId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}
let SID = makeId();
// `?sid=` opens that conversation, as it was kept; otherwise the one this
// browser keeps.
const ASKED_SID = new URLSearchParams(location.search).get("sid");
if (ASKED_SID) {
  SID = ASKED_SID.slice(0, 64);
} else {
  try {
    const kept = localStorage.getItem("v690-sid");
    if (kept) SID = kept; else localStorage.setItem("v690-sid", SID);
  } catch (_) { /* a fresh conversation per load */ }
}
const EXAMPLE_SID = SID + "-example";
let current = { sid: SID, example: false, title: "" };
let busy = false;
let lastTurn = null;
let lastSaid = "";
let pins = {};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}
function add(parent, ...children) {
  children.forEach(child => { if (child) parent.appendChild(child); });
  return parent;
}
function kv(pairs) {
  const box = el("dl", "kv");
  pairs.filter(([, value]) => value !== undefined && value !== null && value !== ""
      && !(Array.isArray(value) && !value.length))
    .forEach(([key, value]) => {
      add(box, el("dt", null, key));
      const dd = el("dd");
      if (value instanceof Node) dd.appendChild(value);
      else dd.textContent = Array.isArray(value) ? value.join(", ") : String(value);
      box.appendChild(dd);
    });
  return box;
}
function name(concept) {
  const text = String(concept || "");
  const parts = text.split(".");
  return parts.length >= 3 && /^\d\d$/.test(parts[parts.length - 1])
    ? parts.slice(0, -2).join(".").replace(/_/g, " ") : text;
}
function describe(discourse, id) {
  const found = ((discourse && discourse.referents) || []).find(one => one.id === id);
  return found ? found.description : (id || "");
}
async function getJSON(url) {
  const response = await fetch(url);
  const found = await response.json();
  if (found.error) throw new Error(found.error);
  return found;
}

// -- the conversation -------------------------------------------------------
const STEP_NAMES = { heard: "heard", read: "read", resolved: "resolved",
  reasoned: "reasoned", planned: "planned", remembered: "remembered",
  programmed: "programmed", looked: "looked", understood: "understood", kept: "kept",
  answered: "answered", said: "said" };
// In an editor (v698's VS Code harness the page is framed by): a code block
// can be opened where it is, or handed to the editor to put in -- the editor
// asks where, and nothing is written without that.
const EMBEDDED = window.parent !== window;
function toEditor(message) {
  if (EMBEDDED) window.parent.postMessage({ source: "graph-topology", ...message }, "*");
}

// One goal of a plan's stack, and the goals beneath it: each a <details>,
// so a hundred subgoals read as an outline rather than a wall. The top is
// open; everything under it is closed until asked for.
function goalTree(node, open) {
  const box = el("details", "goal");
  if (open) box.open = true;
  const acted = (node.fired || []).filter(one => one.outcome !== "declined");
  const head = el("summary");
  add(head, el("span", "goal-name", node.goal || "(the goal)"),
      el("span", "muted", acted.length
        ? "  " + acted.map(one => one.operator).join(" → ")
        : "  nothing fired"));
  box.appendChild(head);
  (node.subgoals || []).forEach(inner => box.appendChild(goalTree(inner, false)));
  if (node.more) box.appendChild(el("div", "muted", `…and ${node.more} more`));
  return box;
}

function wordChips(pairs, cls) {
  const box = el("div", "words");
  pairs.forEach(([word, label]) => {
    const chip = el("span", "word " + (cls ? cls(label) : ""));
    chip.appendChild(document.createTextNode(word));
    if (label && label !== "O") chip.appendChild(el("small", null, label));
    box.appendChild(chip);
  });
  return box;
}

function detailOf(step, turn) {
  const d = step.detail || {};
  const box = el("div", "detail");
  if (step.step === "heard") {
    add(box, kv([["said", d.said], ["the request asks", d.asked],
      ["request", d.request], ["placed as", d.placed],
      ["someone new", d.fresh], ["time words", d.time],
      ["placed against", d.anchor ? `${d.relation} “${d.anchor}”` : ""]]));
  } else if (step.step === "read") {
    if ((d.acts || []).length) {
      const bars = el("div", "bars");
      d.acts.forEach(([act, chance]) => {
        const line = el("div", "barline");
        const fill = el("i");
        fill.style.width = Math.round(chance * 100) + "%";
        line.appendChild(fill);
        add(bars, el("span", null, act), line,
            el("span", "muted", Math.round(chance * 100) + "%"));
      });
      add(box, el("div", "muted", "acts, as the encoder weighed them"), bars);
    }
    if ((d.roles || []).length) {
      add(box, el("div", "muted", "each word's part"),
          wordChips(d.roles, () => ""));
    }
    add(box, kv([
      ["goals", (d.goals || []).map(g => `${g.asked} of ${g.relation}` +
        (g.subject ? ` · subject ${g.subject}` : "") +
        (g.object ? ` · object ${g.object}` : "") +
        (g.verb ? ` · verb ${g.verb}` : ""))],
      ["about", d.mention && d.mention.text],
      ["auxiliary", d.aux], ["said of it", d.rest],
      ["holds", d.holds === false ? "no — denied" : ""],
      ["object", d.object && d.object.text]]));
  } else if (step.step === "resolved") {
    (d || []).forEach(one => add(box, kv([
      ["phrase", `“${one.expression}” → ${one.means}`], ["how", one.how],
      ["candidates", one.candidates],
      ["trie walk", one.wanted ? `${one.wanted.join(" + ")} · ${one.visited} nodes` : ""]])));
  } else if (step.step === "reasoned") {
    if ((d.fired || []).length) {
      const table = el("table", "plain");
      add(table, add(el("tr"), el("th", null, "operator"), el("th", null, "rule"),
                     el("th", null, "outcome"), el("th", null, "claim")));
      d.fired.forEach(one => add(table, add(el("tr"),
        el("td", null, one.operator), el("td", "rule", one.rule || ""),
        el("td", one.outcome === "answered" ? "ok" : "muted", one.outcome),
        el("td", "muted", one.claim || ""))));
      add(box, el("div", "muted", "the executive, cycle by cycle"), table);
    }
    const walk = d.walk || {};
    if ((walk.steps || []).length) {
      const table = el("table", "plain");
      add(table, add(el("tr"), el("th", null, "rule"), el("th", null, "at"),
                     el("th", null, "step")));
      walk.steps.forEach(one => add(table, add(el("tr"),
        el("td", "rule", one.rule), el("td", "muted", String(one.distance)),
        el("td", null, one.detail))));
      add(box, el("div", "muted", `v687's walk — ${walk.verdict}`), table);
    }
    const run = d.run || {};
    if (run.outcome) {
      add(box, el("div", "muted", `v688 on “${d.asked}”`), kv([
        ["verdict", run.verdict], ["trust", run.trust],
        ["confidence", run.confidence != null ? Math.round(run.confidence * 100) + "%" : ""],
        ["lines", (run.lines || []).join(" · ")],
        ["content", run.content && run.content.text]]));
    }
  } else if (step.step === "planned") {
    // v691: what was wanted, what it had to choose from, the plan, and the
    // goal stack the planner pushed to find it.
    add(box, kv([["wanted", d.goal], ["possible", `${d.offered} actions over ${d.verbs} verbs`],
        ["operators fired", String(d.fired)], ["subgoals pushed", String(d.subgoals)],
        ["deepest stack", String(d.deep)], ["times planned", String(d.plans)]]));
    if ((d.plan || []).length) {
      const list = el("ol", "plan");
      d.plan.forEach((one, i) => add(list, add(el("li"),
        document.createTextNode(one + " "),
        el("span", "muted mono", (d.actions || [])[i] || ""))));
      add(box, el("div", "muted", "the plan, as it was carried out"), list);
    }
    (d.surprises || []).forEach(one => add(box, el("div", "bad",
      `surprised after ${one.action}: expected ${(one.expected || []).join(", ") || "no change"}` +
      `, found ${(one.found || []).join(", ") || "nothing"} — so it planned again`)));
    if (d.stack) {
      add(box, el("div", "muted", "the goal stack — each goal, what fired in it, and what it pushed"),
          goalTree(d.stack, true));
    }
  } else if (step.step === "remembered") {
    const list = el("ul", "log");
    (d.events || []).forEach(one => {
      const item = el("li");
      add(item, el("b", null, one.type), document.createTextNode(" " + summarize(one)));
      list.appendChild(item);
    });
    if ((d.events || []).length) add(box, el("div", "muted", "events recorded"), list);
    (d.learned || []).forEach(one => add(box, el("div", null,
      `definitions memory + ${one.concept}: “${one.gloss}”`)));
  } else if (["programmed", "looked", "understood", "kept"].includes(step.step)) {
    box.appendChild(codePanel(d));
  } else if (step.step === "answered") {
    const m = d.message || {};
    add(box, el("div", "muted", "v689's own answer"),
        el("div", "mono", (d.answer || {}).text || ""),
        el("div", "muted", "the message a reply has to carry"),
        kv([["stance", m.stance], ["about", m.subject], ["claim", m.claim],
            ["values", m.values], ["quotes", m.quotes], ["source", m.source],
            ["trust", m.trust], ["rules cited", m.rules]]));
  } else if (step.step === "said") {
    (d.candidates || []).forEach(one => {
      const row = el("div", "candidate");
      const head = el("div", "text", one.text);
      if (one.text === d.text) head.appendChild(el("span", "chosen", d.traced ? "said" : "said, untraced"));
      const read = one.read || {};
      add(row, head,
          wordChips((read.words || []).map((w, i) => [w, (read.parts || [])[i]]),
                    part => "p-" + part),
          el("div", one.trace.traced ? "ok" : "bad",
             `reads as ${read.stance} (${Math.round((read.chance || 0) * 100)}%) — ${one.trace.why}`));
      box.appendChild(row);
    });
    if (d.source) add(box, el("div", "muted", `said as it stands — ${d.source}`), el("div", "mono", d.text || ""));
    else add(box, el("div", "muted", `written and read back in ${d.seconds}s`));
  }
  return box;
}

function renderSteps(turn) {
  const list = el("ol", "steps");
  (turn.steps || []).forEach(step => {
    const said = step.step === "said";
    const item = el("li", step.step + (said && !(step.detail || {}).traced ? " bad" : ""));
    add(item, el("span", "step-name", STEP_NAMES[step.step] || step.step),
        el("span", "step-line", step.line));
    const open = el("button", "step-open", "details");
    let shown = null;
    open.addEventListener("click", () => {
      if (shown) { shown.remove(); shown = null; open.textContent = "details"; return; }
      shown = detailOf(step, turn);
      item.appendChild(shown);
      open.textContent = "hide";
    });
    item.appendChild(open);
    list.appendChild(item);
  });
  return list;
}

function codeIsh(text) {
  return /\n|function\s|\w\([^)]*\)\s*(===?|=>|->)/.test(text || "");
}
function renderTurn(turn, box) {
  box.textContent = "";
  // What was typed this turn: the request's own text keeps its lines, but a
  // turn that continues or asks about an earlier request carries that one.
  const typed = ((turn.answer || {}).code || {}).request;
  const flat = text => String(text || "").replace(/\s+/g, " ").trim();
  const typedText = typed && flat(typed.said) === flat(turn.said) ? typed.said : turn.said;
  box.appendChild(el("div", "you" + (codeIsh(typedText) ? " code-ish" : ""), typedText));
  if (turn.number != null && !turnsSeen.includes(turn.number)) turnsSeen.push(turn.number);
  const me = el("div", "me");
  const said = turn.reply || null;
  const answer = turn.answer || {};
  const message = (said && said.message) || {};
  const OUTCOME = { verified: "yes", denied: "no", retrieved: "value" };
  const stance = message.stance || OUTCOME[answer.outcome] || answer.outcome || "unknown";
  let reply;
  if (said && said.text) {
    reply = el("div", "reply" + (said.traced ? "" : " untraced"), said.text);
  } else if (said && said.error) {
    reply = el("div", "reply silent", `the decoder failed: ${said.error}`);
  } else {
    reply = el("div", "reply silent", answer.text || "");
  }
  me.appendChild(reply);
  const code = codeAnswer(answer.code);
  if (code) me.appendChild(code);
  ((answer.code || {}).blocks || []).forEach(one => me.appendChild(codeBlock(one.code,
    { title: one.title, kind: one.kind, small: true, file: one.file, line: one.line,
      closed: ((answer.code || {}).blocks || []).length > 1 })));
  const badges = el("div", "badges");
  add(badges, el("span", "chip stance s-" + stance, stance));
  if (said && said.text) {
    add(badges, el("span", "chip " + (said.traced ? "traced" : "untraced-chip"),
                   said.traced ? "✓ reads back" : "⚠ untraced"));
  }
  if (answer.source) add(badges, el("span", "chip", "from " + answer.source));
  ((turn.heard || {}).time || []).length &&
    add(badges, el("span", "chip", "when: " + turn.heard.time.join(" ")));
  const how = el("button", "how", "how I got here");
  let steps = null;
  how.addEventListener("click", () => {
    if (steps) { steps.remove(); steps = null; how.textContent = "how I got here"; return; }
    steps = renderSteps(turn);
    me.appendChild(steps);
    how.textContent = "hide the steps";
  });
  badges.appendChild(how);
  if (turn.number != null) {
    const all = el("button", "how", "everything");
    all.style.marginLeft = "10px";
    all.title = "everything this turn did: the graph, the executive, the searches, the raw turn";
    all.addEventListener("click", () => inspect(turn.number));
    badges.appendChild(all);
  }
  me.appendChild(badges);
  const next = (answer.suggest || []);
  if (next.length) {
    const row = el("div", "next");
    next.forEach(one => {
      const chip = el("button", one.send ? "" : "fill", one.text);
      chip.title = one.send ? "ask it" : "put it in the box, to finish and say";
      chip.addEventListener("click", async () => {
        if (one.send && !busy) {
          busy = true;
          await say(one.text);
          busy = false;
        } else if (!one.send) {
          LINE.value = one.text;
          fitLine();
          LINE.focus();
          const at = one.text.indexOf("?");
          if (at >= 0) LINE.setSelectionRange(at, at + 1);
        }
      });
      row.appendChild(chip);
    });
    me.appendChild(row);
  }
  box.appendChild(me);
  // `?steps=1`: every turn shown with its steps open.
  if (new URLSearchParams(location.search).get("steps") === "1" &&
      (turn.steps || []).length) how.click();
}

function transcriptBox() {
  const box = el("div");
  box.style.display = "flex";
  box.style.flexDirection = "column";
  box.style.gap = "8px";
  document.getElementById("transcript").appendChild(box);
  return box;
}
function scrollDown() {
  const pane = document.getElementById("transcript");
  pane.scrollTop = pane.scrollHeight;
}

async function say(text) {
  const box = transcriptBox();
  add(box, el("div", "you" + (codeIsh(text) ? " code-ish" : ""), text),
      el("div", "me pending", codeIsh(text) ? "reading the request, writing, searching, checking …"
                                          : "reading, thinking, saying …"));
  scrollDown();
  try {
    const turn = await getJSON(`/api/say?sid=${encodeURIComponent(current.sid)}` +
      `&q=${encodeURIComponent(text)}&example=${current.example ? 1 : 0}`);
    renderTurn(turn, box);
    lastTurn = turn;
    lastSaid = text;
    renderMemory(turn);
    renderSenses(turn.senses || [], turn.pins || pins);
  } catch (bad) {
    box.textContent = "";
    add(box, el("div", "you" + (codeIsh(text) ? " code-ish" : ""), text),
        el("div", "me error", String(bad.message || bad)));
  }
  scrollDown();
}

function summarize(event) {
  const data = event.data || {};
  switch (event.type) {
    case "told": return `${data.node} ${data.relation} “${data.object}”` +
      (data.when ? ` in ${data.when.episode}` : "");
    case "occurred": return `${data.id} ${data.verb} by ${data.subject}` +
      (data.object ? `, ${data.object}` : "") + ` in ${data.episode}`;
    case "ordered": return `${data.first} ${data.how} ${data.second}`;
    case "changed": return `${data.occurrence}: ${data.individual} ${data.kind} ` +
      `${data.word || data.place || data.place_word} ${data.after ? "after" : "ended"}`;
    case "episode_opened": return `${data.id} ${data.label}`;
    case "referent_added": return `${data.id} ${data.kind}`;
    case "placed": return `${data.individual} under ${data.node || data.word}`;
    default:
      return Object.entries(data).filter(([, v]) => typeof v !== "object")
        .map(([k, v]) => `${k}=${v}`).join(" ");
  }
}

// -- episodic memory ----------------------------------------------------------
function stat(value, label) {
  return add(el("div", "stat"), el("b", null, String(value)), el("span", null, label));
}

function whereNow(memory, discourse) {
  const timeline = (memory && memory.timeline) || {};
  const at = {};
  (timeline.episodes || []).forEach(episode => {
    (episode.changes || []).forEach(change => {
      if (change.kind !== "location" || !change.after) return;
      at[change.individual] = change;
    });
  });
  const referents = (discourse && discourse.referents) || [];
  const byId = Object.fromEntries(referents.map(one => [one.id, one]));
  const places = {};
  Object.entries(at).forEach(([individual, change]) => {
    const place = change.place ? describe(discourse, change.place) : `the ${change.place_word}`;
    const holder = change.place && byId[change.place] &&
      (byId[change.place].kind === "person" || byId[change.place].name);
    const key = holder ? "carried" : place;
    (places[key] = places[key] || []).push({ who: describe(discourse, individual),
                                             with: holder ? place : "" });
  });
  return places;
}

function renderMemory(turn) {
  const box = document.getElementById("tab-episodic");
  box.textContent = "";
  const memory = (turn && turn.memory) || {};
  const discourse = (turn && turn.discourse) || {};
  const timeline = memory.timeline || {};
  const episodes = timeline.episodes || [];
  const referents = discourse.referents || [];
  if (!episodes.length && !referents.length) {
    add(box, el("h2", null, "episodic memory"),
        el("p", "empty", "Nothing has come up yet. Tell me about someone or something."));
    return;
  }
  const occurrences = episodes.reduce((sum, one) => sum + one.occurrences.length, 0);
  add(box, el("h2", null, "this conversation"),
      add(el("div", "stats"), stat(referents.length, "individuals"),
          stat(episodes.length, "episodes"), stat(occurrences, "occurrences"),
          stat(memory.events || 0, "events"), stat(memory.nodes || 0, "trie nodes")));

  const places = whereNow(memory, discourse);
  if (Object.keys(places).length) {
    box.appendChild(el("h2", null, "where everything is now"));
    const grid = el("div", "places");
    Object.entries(places).forEach(([place, who]) => {
      const card = add(el("div", "place"), el("b", null, place === "carried" ? "carried" : place));
      who.forEach(one => add(card, add(el("div", "who"), document.createTextNode(one.who),
        one.with ? el("span", "with", ` with ${one.with}`) : null)));
      grid.appendChild(card);
    });
    box.appendChild(grid);
  }

  if (episodes.length) {
    box.appendChild(el("h2", null, "story time"));
    const lane = el("div", "lane");
    const order = timeline.order || [];
    episodes.forEach(episode => {
      const card = el("div", "episode" + (episode.current ? " current" : ""));
      add(card, add(el("div", "head"),
        el("b", null, episode.key === "then" ? "back then" : episode.label),
        el("span", "chip", episode.tense),
        episode.current ? el("span", "chip traced", "now") : null));
      const list = el("ul", "occ");
      episode.occurrences.forEach(occurrence => {
        const item = el("li");
        add(item, el("span", "order", occurrence.id + " "),
            document.createTextNode(`“${occurrence.said}”`));
        // Each placement is shown on the occurrence told later: the one it
        // placed.
        const number = id => parseInt(String(id).slice(1), 10) || 0;
        order.filter(edge => (edge.first === occurrence.id || edge.second === occurrence.id)
            && number(occurrence.id) === Math.max(number(edge.first), number(edge.second)))
          .forEach(edge => {
            const other = edge.first === occurrence.id ? edge.second : edge.first;
            const how = edge.how === "during" ? "while" : edge.first === occurrence.id ? "before" : "after";
            add(item, el("span", "order", ` · ${how} ${other}`));
          });
        (episode.changes || []).filter(c => c.occurrence === occurrence.id).forEach(change => {
          const who = describe(discourse, change.individual);
          const what = change.kind === "location"
            ? `at ${change.place ? describe(discourse, change.place) : change.place_word}` : change.word;
          add(item, el("span", "change", `→ ${who} ${change.after ? "" : "no longer "}${what}`));
        });
        list.appendChild(item);
      });
      (episode.states || []).forEach(state => add(list, add(el("li"),
        el("span", "state", describe(discourse, state.individual)),
        document.createTextNode(state.said ? ` — “${state.said}”` : ` ${state.relation} ${state.object}`))));
      if (!episode.occurrences.length && !(episode.states || []).length) {
        list.appendChild(el("li", "empty", "nothing told of this time yet"));
      }
      card.appendChild(list);
      lane.appendChild(card);
    });
    box.appendChild(lane);
  }

  if (referents.length) {
    box.appendChild(el("h2", null, "who and what"));
    referents.forEach(one => {
      const card = el("div", "card" + (one.id === discourse.focus ? " focus" : ""));
      add(card, add(el("div", "head"), el("b", null, one.description),
                    one.name ? el("span", "chip", "called " + one.name) : null,
                    one.owner ? el("span", "chip", "yours") : null,
                    one.id === discourse.focus ? el("span", "chip traced", "in focus") : null,
                    el("span", "id", one.id)));
      const bar = el("div", "salience");
      const fill = el("i");
      fill.style.width = Math.min(100, Math.round((one.salience || 0) * 100)) + "%";
      bar.appendChild(fill);
      add(card, bar, el("div", "meta",
        `a ${name(one.sense) || one.kind}` + (one.sense ? ` · sense ${one.sense}` : "") +
        ` · salience ${(one.salience || 0).toFixed(2)}`));
      if ((one.told || []).length) {
        const facts = el("ul", "facts");
        one.told.forEach(fact => add(facts, add(el("li"),
          el("span", "said", fact.said ? `“${fact.said}”` : `${fact.relation} ${fact.object}`),
          el("span", "as", `${fact.relation} ${fact.object}` +
            ((fact.bound || []).length ? " → " + fact.bound.map(id => describe(discourse, id)).join(", ") : "")))));
        card.appendChild(facts);
      }
      box.appendChild(card);
    });
  }

  const log = memory.log || [];
  if (log.length) {
    const details = el("details");
    add(details, el("summary", "muted", `event log — ${memory.events} events, the last ${log.length} shown, newest first`));
    const list = el("ul", "log");
    log.slice().reverse().forEach(event => add(list, add(el("li"),
      document.createTextNode(`${event.seq} `), el("b", null, event.type),
      document.createTextNode(" " + summarize(event)))));
    details.appendChild(list);
    box.appendChild(details);
  }
}

// -- long-term memory ---------------------------------------------------------
async function renderLongterm(like) {
  const box = document.getElementById("tab-longterm");
  let found;
  try {
    found = await getJSON(`/api/longterm?like=${encodeURIComponent(like || "")}`);
  } catch (bad) {
    box.textContent = "";
    box.appendChild(el("p", "error", String(bad.message || bad)));
    return;
  }
  box.textContent = "";
  const summary = found.summary || {};
  add(box, el("h2", null, "long-term memory"),
      el("p", "note", "Shared by every conversation and kept on disk: kinds, taxonomy and norms you taught, and the definitions read so far. Examples keep what they teach to themselves."),
      add(el("div", "stats"), stat(summary.kinds || 0, "kinds coined"),
          stat(summary.edges || 0, "taxonomy edges"), stat(summary.norms || 0, "norms"),
          stat(summary.definitions || 0, "definitions"), stat(summary.facts || 0, "facts read")));

  box.appendChild(el("h2", null, "what you taught me"));
  const children = {};
  (found.edges || []).forEach(edge => (children[name(edge.parent)] = children[name(edge.parent)] || []).push(edge));
  const norms = {};
  (found.norms || []).forEach(norm => (norms[name(norm.node)] = norms[name(norm.node)] || []).push(norm));
  const kinds = new Set([...Object.keys(children), ...Object.keys(norms),
                         ...(found.edges || []).map(edge => name(edge.node))]);
  if (!kinds.size) {
    box.appendChild(el("p", "empty", "Nothing taught yet — try “a wemble is a kind of animal”."));
  } else {
    const tree = el("ul", "tree");
    const roots = Object.keys(children).filter(parent =>
      !(found.edges || []).some(edge => name(edge.node) === parent));
    const drawn = new Set();
    function draw(kind, into) {
      if (drawn.has(kind)) return;
      drawn.add(kind);
      const item = el("li");
      add(item, el("span", "kind", kind));
      (norms[kind] || []).forEach(norm => add(item, el("div", "meta",
        `“${norm.said || `${norm.relation} ${norm.object}`}”` + (norm.against ? ` · against the store: ${norm.against}` : ""))));
      const below = children[kind] || [];
      if (below.length) {
        const list = el("ul", "tree");
        below.forEach(edge => {
          const child = name(edge.node);
          draw(child, list);
        });
        item.appendChild(list);
      }
      into.appendChild(item);
    }
    roots.forEach(root => draw(root, tree));
    [...kinds].filter(kind => !drawn.has(kind)).forEach(kind => draw(kind, tree));
    box.appendChild(tree);
  }

  box.appendChild(el("h2", null, "definitions memory"));
  const search = el("div", "search");
  const input = el("input");
  input.type = "text";
  input.placeholder = "find a concept or a word in a gloss";
  input.value = like || "";
  const go = el("button", "quiet", "find");
  const run = () => renderLongterm(input.value);
  go.addEventListener("click", run);
  input.addEventListener("keydown", event => { if (event.key === "Enter") run(); });
  add(search, input, go);
  box.appendChild(search);
  if (!(found.definitions || []).length) {
    box.appendChild(el("p", "empty", like ? "No definition read matches." : "No definition read yet — ask “what is a kitten”."));
  }
  (found.definitions || []).forEach(one => add(box, add(el("div", "definition"),
    el("b", null, name(one.concept)), el("span", "muted", ` ${one.concept}`),
    el("div", null, `“${one.gloss}”`),
    el("div", "meta", (one.genus ? `a kind of ${name(one.genus)} · ` : "") +
      `${one.facts} fact${one.facts === 1 ? "" : "s"} read · ${one.how}`))));

  box.appendChild(el("h2", null, "conversations kept"));
  const table = el("table", "plain");
  add(table, add(el("tr"), el("th", null, "conversation"), el("th", null, "turns"),
                 el("th", null, "events"), el("th", null, "saved")));
  (found.conversations || []).forEach(one => add(table, add(el("tr"),
    el("td", one.id === current.sid ? "ok" : "", (one.id === SID ? "yours" : one.example ? "an example" : one.id.slice(0, 10))),
    el("td", null, String(one.turns)), el("td", null, String(one.events)),
    el("td", "muted", new Date(one.saved * 1000).toLocaleString()))));
  box.appendChild(table);
  const unlearn = el("button", "quiet", "unlearn everything taught");
  unlearn.style.marginTop = "12px";
  unlearn.addEventListener("click", async () => {
    if (busy || !confirm("Forget every kind, taxonomy edge and norm taught in any conversation?")) return;
    await getJSON("/api/unlearn?confirm=yes");
    renderLongterm();
  });
  box.appendChild(unlearn);
}

// -- senses -------------------------------------------------------------------
function renderSenses(offered, pinned) {
  pins = pinned || {};
  const box = document.getElementById("tab-senses");
  box.textContent = "";
  add(box, el("h2", null, "the senses your words were taken in"),
      el("p", "note", "Each word of the last turn, with the senses the store has for it. The one marked is the one used: the store's first, unless you pin another. A pin holds for this conversation — for every individual placed from now on and every question put to the store."));
  const pinnedWords = Object.entries(pins);
  if (pinnedWords.length) {
    box.appendChild(el("h2", null, "pinned"));
    const row = el("div", "row");
    pinnedWords.forEach(([word, sense]) => {
      const chip = el("button", "quiet", `${word} → ${sense} ✕`);
      chip.addEventListener("click", () => pin(word, ""));
      row.appendChild(chip);
    });
    box.appendChild(row);
  }
  if (!offered.length) {
    box.appendChild(el("p", "empty", "Say something with a word the store has senses for."));
    return;
  }
  offered.forEach(entry => {
    const section = el("div", "senseword");
    add(section, add(el("div", "head"), el("b", null, entry.word),
      el("span", "muted", entry.as === "n" ? "as a noun" : ""),
      entry.pinned ? el("span", "chip traced", "pinned") : null));
    entry.senses.forEach(sense => {
      const on = entry.pinned ? entry.pinned === sense.id : sense.picks;
      const row = el("div", "sense" + (on ? " on" : ""));
      add(row, el("span", "dot"), add(el("div"),
        el("span", "id", sense.id + " "),
        el("span", "muted", `${sense.pos} · ${sense.facts} facts`),
        el("div", null, sense.definition || "(no definition)")));
      row.addEventListener("click", () => pin(entry.word, on && entry.pinned ? "" : sense.id));
      section.appendChild(row);
    });
    box.appendChild(section);
  });
  if (lastSaid) {
    const again = el("button", "quiet", `ask “${lastSaid}” again with these senses`);
    again.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      await say(lastSaid);
      busy = false;
    });
    box.appendChild(again);
  }
}

async function pin(word, sense) {
  const found = await getJSON(`/api/pin?sid=${encodeURIComponent(current.sid)}` +
    `&w=${encodeURIComponent(word)}&sense=${encodeURIComponent(sense)}`);
  pins = found.pins || {};
  const offered = ((lastTurn && lastTurn.senses) || []).map(entry =>
    ({ ...entry, pinned: pins[entry.word] || null }));
  if (lastTurn) lastTurn.senses = offered;
  renderSenses(offered, pins);
}

// -- v697: code blocks, each in its own little section ------------------------
const TS_WORDS = new Set(("abstract as async await break case catch class const " +
  "continue debugger declare default delete do else enum export extends false " +
  "finally for from function get if implements import in instanceof interface " +
  "let new null of private protected public readonly return set static super " +
  "switch this throw true try type typeof undefined var void while yield").split(" "));
const TS_TYPES = new Set(("string number boolean any unknown never object bigint " +
  "symbol Array Map Set Record Promise").split(" "));
const TOKENS = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)|(=>|===|!==|==|!=|<=|>=|&&|\|\||\?\?|\.\.\.|[-+*/%=<>!?:&|^~])/g;

// One line of TypeScript as highlighted spans: comments, strings, numbers,
// calls, keywords, types, operators. A string or a comment over several
// lines is cut at each line and carried on.
function highlightLines(code, lang) {
  if (lang === "json") return code.split("\n").map(line => highlightJSON(line));
  const lines = [];
  let line = document.createElement("span");
  const push = (text, cls) => {
    const parts = text.split("\n");
    parts.forEach((part, i) => {
      if (i > 0) { lines.push(line); line = document.createElement("span"); }
      if (!part) return;
      if (cls) line.appendChild(el("span", cls, part));
      else line.appendChild(document.createTextNode(part));
    });
  };
  let last = 0;
  code.replace(TOKENS, (match, comment, string, number, call, word, op, at) => {
    if (at > last) push(code.slice(last, at), null);
    let cls = null;
    if (comment) cls = "tok-c";
    else if (string) cls = "tok-s";
    else if (number) cls = "tok-n";
    else if (call) cls = TS_WORDS.has(call) ? "tok-k" : "tok-f";
    else if (word) cls = TS_WORDS.has(word) ? "tok-k" : TS_TYPES.has(word) ? "tok-t" : null;
    else if (op) cls = "tok-p";
    push(match, cls);
    last = at + match.length;
    return match;
  });
  if (last < code.length) push(code.slice(last), null);
  lines.push(line);
  return lines;
}
function highlightJSON(line) {
  const out = document.createElement("span");
  let last = 0;
  line.replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|\b(true|false|null)\b/g,
    (match, string, colon, number, word, at) => {
      if (at > last) out.appendChild(document.createTextNode(line.slice(last, at)));
      if (string) {
        out.appendChild(el("span", colon ? "tok-f" : "tok-s", string));
        if (colon) out.appendChild(document.createTextNode(colon));
      } else out.appendChild(el("span", number ? "tok-n" : "tok-k", match));
      last = at + match.length;
      return match;
    });
  if (last < line.length) out.appendChild(document.createTextNode(line.slice(last)));
  return out;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    // http on another host has no clipboard API: the old way
    const area = el("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (_) { /* not copied */ }
    area.remove();
    return done;
  }
}
function flash(button, said) {
  const was = button.textContent;
  button.textContent = said;
  button.classList.add("done");
  setTimeout(() => { button.textContent = was; button.classList.remove("done"); }, 1300);
}

// A block of code in its own section: what it is in the header, the lines
// numbered outside what is selected, and copy / download / wrap / fold.
// options: {lang, title, kind, chips: [[text, cls]], file, answer, small,
//           foldAt (lines shown before "show all"), closed}
function codeBlock(code, options) {
  const o = options || {};
  const lang = o.lang || "ts";
  code = String(code == null ? "" : code).replace(/\s+$/, "");
  const lines = code.split("\n");
  const box = el("section", "codeblock" + (o.answer ? " answer" : "") +
                 (o.small ? " small" : ""));
  const head = el("header");
  add(head, el("span", "lang " + lang, lang === "ts" ? "TS" : lang));
  if (o.title) head.appendChild(el("span", "title", o.title));
  if (o.kind) head.appendChild(el("span", "kind", o.kind));
  (o.chips || []).forEach(([text, cls]) => head.appendChild(el("span", "chip " + (cls || ""), text)));
  const tools = el("span", "tools");
  const copy = el("button", null, "⧉ copy");
  copy.title = "copy the code (without line numbers)";
  copy.addEventListener("click", async () => flash(copy, (await copyText(code)) ? "✓ copied" : "✗ not copied"));
  const save = el("button", null, "⤓ " + (lang === "json" ? ".json" : ".ts"));
  save.title = "download it as a file";
  save.addEventListener("click", () => {
    const blob = new Blob([code + "\n"], { type: "text/plain" });
    const link = el("a");
    link.href = URL.createObjectURL(blob);
    link.download = o.file || ((o.title || "code").replace(/[^\w.-]+/g, "_") +
                               (lang === "json" ? ".json" : ".ts"));
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
  const wrap = el("button", null, "↩ wrap");
  wrap.title = "wrap long lines";
  wrap.addEventListener("click", () => box.classList.toggle("wrap"));
  const fold = el("button", null, o.closed ? "▸ open" : "▾ fold");
  fold.addEventListener("click", () => {
    box.classList.toggle("closed");
    fold.textContent = box.classList.contains("closed") ? "▸ open" : "▾ fold";
  });
  add(tools, copy, save, wrap, fold);
  if (EMBEDDED) {
    if (o.file) {
      const go = el("button", null, "↗ open");
      go.title = `open ${o.file}` + (o.line ? ` at line ${o.line}` : "");
      go.addEventListener("click", () => toEditor({ type: "open", file: o.file, line: o.line || 1 }));
      tools.insertBefore(go, copy);
    }
    if (lang === "ts" && !o.file) {
      const put = el("button", null, "⇲ insert");
      put.title = "put it in the editor: you choose where";
      put.addEventListener("click", () => toEditor({ type: "insert", code }));
      tools.insertBefore(put, copy);
    }
  }
  head.appendChild(tools);
  box.appendChild(head);
  const pre = el("pre");
  highlightLines(code, lang).forEach(line => {
    line.className = "l";
    pre.appendChild(line);
  });
  box.appendChild(pre);
  const foldAt = o.foldAt === undefined ? 30 : o.foldAt;
  if (foldAt && lines.length > foldAt) {
    box.classList.add("folded");
    const more = el("button", "more", `show all ${lines.length} lines`);
    more.addEventListener("click", () => {
      box.classList.toggle("folded");
      more.textContent = box.classList.contains("folded")
        ? `show all ${lines.length} lines` : "show fewer";
    });
    box.appendChild(more);
  }
  if (o.closed) box.classList.add("closed");
  return box;
}

// A section that opens and closes, with what it holds said in its summary.
function panel(title, said, open, fill) {
  const box = el("details", "panel");
  if (open) box.open = true;
  const head = el("summary");
  add(head, el("b", null, title), el("span", "muted", said || ""));
  box.appendChild(head);
  const inside = el("div", "inside");
  box.appendChild(inside);
  let filled = false;
  const make = () => { if (!filled) { filled = true; fill(inside); } };
  if (open) make();
  box.addEventListener("toggle", () => { if (box.open) make(); });
  return box;
}
function bars(pairs) {
  const box = el("div", "bars");
  (pairs || []).forEach(([label, chance]) => {
    const line = el("div", "barline");
    const fill = el("i");
    fill.style.width = Math.round(chance * 100) + "%";
    line.appendChild(fill);
    add(box, el("span", "mono", label), line,
        el("span", "muted", Math.round(chance * 100) + "%"));
  });
  return box;
}

// -- what solving a request for code came to ----------------------------------
const CODE_STATUS = {
  confirmed: ["confirmed", "good"], met: ["meets the examples", "warn"],
  unverified: ["unverified", "warn"], unsolved: ["unsolved", "badc"],
  agreed: ["writers agree, unchecked", "warn"], about: ["about the answer", ""],
  missing: ["needs an example", "warn"], failed: ["failed", "badc"] };

function codeAnswer(code) {
  const answer = (code || {}).answer || {};
  if (!answer.code) return null;
  const [text, cls] = CODE_STATUS[answer.status] || [answer.status, ""];
  const chips = [[text, cls]];
  if (answer.route) chips.push(["route: " + answer.route, ""]);
  if ((answer.by || []).length) chips.push(["by " + answer.by.join(", "), ""]);
  if (answer.mode === "prints") chips.push(["what it prints is checked", ""]);
  chips.push([answer.as === "written" ? "as a writer wrote it"
    : answer.as === "rewritten" ? "rewritten, doing the same"
    : "printed from the search's tree", ""]);
  // the ways of writing asked for (v698): each, held or not
  const ways = answer.ways;
  if (ways) (ways.asked || []).forEach(way => chips.push(
    (ways.missing || []).includes(way) ? ["✗ not " + way, "badc"] : ["✓ " + way, "good"]));
  return codeBlock(answer.code, { title: answer.entry, kind: "answer", chips,
                                  answer: true, file: answer.entry + ".ts" });
}

function codePanel(code) {
  const box = el("div");
  if (code.read) {
    const r = code.read;
    box.appendChild(panel("read", `the encoder: ${r.act} (${Math.round(r.chance * 100)}%)` +
        (r.aspect !== "none" ? `, ${r.aspect}` : "") + (r.subject !== "none" ? ` of ${r.subject}` : "") +
        ((r.ways || []).length ? `, written: ${r.ways.join(" + ")}` : ""), false, inside => {
      add(inside, el("div", "muted", "what the message does, as the encoder weighed it"), bars(r.acts),
          el("div", "muted", "each word's part"),
          wordChips(r.words.map((w, i) => [w, r.roles[i]]), part => part === "O" ? "" : "p-SUBJ"),
          kv([["aspect", `${r.aspect} (${Math.round(r["aspect chance"] * 100)}%)`],
              ["subject", r.subject], ["spans", JSON.stringify(r.spans)]]));
    }));
  }
  if (code.knowledge) {
    const k = code.knowledge;
    box.appendChild(panel("knowledge", Array.isArray(k) ? "what was taught, used here" : "kept, long-term", true, inside => {
      if (Array.isArray(k)) {
        k.forEach(one => add(inside, el("div", null,
          `${one.concept}: one of ${one.members.join(", ")} — offered to the writers, and to the search as ${one.function}(x)`)));
      } else {
        inside.appendChild(jsonTree(k, "knowledge", true));
      }
    }));
    if (!Array.isArray(k)) return box;
  }
  const request = code.request || {};
  const answer = code.answer || {};
  if (answer.error) {
    add(box, el("div", "error", answer.error));
    if (answer.trace) box.appendChild(codeBlock(answer.trace, { lang: "text", title: "traceback", closed: true }));
  }
  if (code.project) {
    const f = code.project;
    box.appendChild(panel("project", `asked: ${f.asked}` + (f.name ? ` — ${f.name}` : ""), true, inside => {
      add(inside, kv([["said", f.said], ["taken as", f.asked]]));
      inside.appendChild(jsonTree(f.looked, "what was looked up", true));
    }));
    return box;
  }
  if (code.followup) {
    const f = code.followup;
    box.appendChild(panel("follow-up", `asked: ${f.asked}`, true, inside => {
      add(inside, kv([["said", f.said], ["taken as", f.asked]]));
      inside.appendChild(jsonTree(f.looked, "what was looked up and run", true));
    }));
    return box;
  }
  if (code.continued) {
    add(box, el("div", "note", "taken with what was asked before — the request as it now stands:"),
        codeBlock(code.continued.asked, { lang: "text", title: "the request", small: true }));
  }
  box.appendChild(panel("request", "what was asked, as read", true, inside => {
    add(inside, kv([["in English", request.english], ["calls", request.entry],
                    ["made", (request.made || []).join(", ")],
                    ["what it does", request.mode === "prints" ? "prints" : "returns"],
                    ["your words say", request.from_words ? request.from_words.said : ""],
                    ["missing", request.missing]]));
    if (request.signature) inside.appendChild(codeBlock(request.signature,
      { title: "signature", kind: (request.made || []).includes("signature") ? "inferred from the examples" : "as given", small: true }));
    if ((request.examples || []).length) inside.appendChild(codeBlock(
      request.examples.map(one => one.said).join("\n"),
      { title: "examples", kind: `${request.examples.length} — what it is checked by`, small: true }));
  }));
  if (answer.code) {

                      ["checked by", `${answer.examples} example(s)`]]));
    }));
  }
  if (code.read) box.appendChild(panel("read", "what the reader of meaning expects of it", false, inside => {
    add(inside, el("div", "muted", "made of (uses)"), bars(code.read.uses),
        el("div", "muted", "behaves (beyond the examples)"), bars(code.read.behaviour),
        el("div", "muted", "returns / what gives its result"),
        bars((code.read.returns || []).concat(code.read.root || [])));
  }));
  const risk = code.risk;
  if (risk) {
    box.appendChild(panel("risk", `${(risk.cells || []).length} shaded corner(s): ` +
        ((risk.cells || []).join(" · ") || "ordinary review"), false, inside => {
      const grid = el("div", "risks");
      "DPSUXB".split("").forEach(f => {
        const score = risk.scores[f];
        const tile = el("div", "risk" + (score >= risk.high ? " high" : ""));
        add(tile, el("b", null, `${f} ${score}`), el("span", null, risk.names[f]));
        grid.appendChild(tile);
      });
      inside.appendChild(grid);
      const rows = el("table", "plain");
      add(rows, add(el("tr"), el("th", null, "corner"), el("th", null, "what the matrix does there")));
      Object.entries(risk.matrix || {}).forEach(([cell, moves]) => add(rows, add(el("tr"),
        el("td", "rule", cell), el("td", null, moves.join(", ")))));
      if ((risk.cells || []).length) inside.appendChild(rows);
      add(inside, el("div", "muted", "moves on: " + ((risk.moves || []).join(", ") || "none")));
    }));
  }
  const writers = code.writers || [];
  if (writers.length) {
    const all = writers.flatMap(w => w.rounds.flatMap(r => r.programs));
    box.appendChild(panel("written", `${all.length} programs by ${writers.length} writer(s), ` +
        `${all.filter(p => p.meets).length} meet the examples`, false, inside => {
      writers.forEach(writer => {
        const part = el("div", "writer");
        part.appendChild(el("div", "head", writer.writer));
        writer.rounds.forEach(round => round.programs.forEach((one, i) => {
          const chips = [[`round ${round.round + 1} · #${i + 1}`, ""],
                         one.read ? ["reads", "good"] : ["does not read", "badc"]];
          if (one.read) chips.push(one.meets ? ["meets the examples", "good"] : ["misses", "warn"]);
          if (one.program && one.program === answer.program) chips.push(["the answer", "on"]);
          part.appendChild(codeBlock(one.text, { small: true, closed: true,
            title: request.entry || "", chips, foldAt: 20 }));
        }));
        inside.appendChild(part);
      });
    }));
  }
  const open = code.open;
  if (open) {
    box.appendChild(panel("ran", `every program run: ${open.groups.length} different behaviour(s)` +
        (open.signature ? ` · ${open.signature}` : ""), false, inside => {
      add(inside, el("div", "muted", "run on: " + open.inputs.map(args =>
        `(${args.map(one => JSON.stringify(one)).join(", ")})`).join("  ")));
      const table = el("table", "plain");
      add(table, add(el("tr"), el("th", null, "who"), el("th", null, "programs"),
                     el("th", null, open.mode === "prints" ? "returned · printed" : "what it gave")));
      open.groups.forEach((group, i) => add(table, add(el("tr"),
        el("td", i === 0 ? "ok" : null, group.authors.join(", ") + (i === 0 ? " — the answer" : "")),
        el("td", "muted", String(group.count)),
        el("td", "mono muted", group.does.map(one => JSON.stringify(one)).join(" · ")))));
      inside.appendChild(table);
      open.groups.slice(0, 4).forEach((group, i) => inside.appendChild(codeBlock(group.programs[0],
        { small: true, closed: i > 0, title: `behaviour ${i + 1}`, kind: "by " + group.authors.join(", ") })));
    }));
  }
  const search = code.search;
  if (search) {
    box.appendChild(panel("searched", `${search.evaluated} candidates in ${search.seconds}s, ` +
        `route ${search.route}` + (search.confirmed ? ", confirmed" : ""), false, inside => {
      add(inside, kv([["route", search.route], ["candidates evaluated", search.evaluated],
                      ["seconds", search.seconds], ["refused", search.refused],
                      ["confirmed", search.confirmed ? "yes — a second writer or the search agrees" : "no"]]));
      const list = el("ul", "events");
      (search.events || []).forEach(one => {
        const item = el("li");
        add(item, el("span", "at", `@${one.at}`), el("span", "ev", one.event));
        let said = "";
        if (one.event === "stage") said = "→ " + one.stage;
        else if (one.event === "begin") said = `depth ${one.depth}, budget ${one.budget}, ${one.proposals} proposals; moves: ${(one.moves || []).join(", ") || "none"}`;
        else if (one.event === "level") said = `level ${one.depth}: kept ` + Object.entries(one.kept || {}).map(([k, v]) => `${v} ${k}`).join(", ");
        else if (one.event === "meets") said = `${one.program}   (${one.stage})`;
        else if (one.event === "refused") said = `${one.program} — ${one.why}`;
        else if (one.event === "chosen") said = `${one.program} (${one.stage}) by ${one.by}${one.confirmed ? ", confirmed" : ""}`;
        else if (one.event === "end") said = `${one.route}${one.program ? ": " + one.program : ""} in ${one.seconds}s`;
        item.appendChild(document.createTextNode(said));
        list.appendChild(item);
      });
      add(inside, el("div", "muted", "what the search did, as it happened"), list);
      const chosen = (search.events || []).find(one => one.event === "chosen");
      if (chosen && (chosen.behaviours || []).length) {
        const table = el("table", "plain");
        add(table, add(el("tr"), el("th", null, "who"), el("th", null, "programs"),
                       el("th", null, "what they do beyond the examples")));
        chosen.behaviours.forEach(group => add(table, add(el("tr"),
          el("td", null, (group.authors || []).join(", ")),
          el("td", "mono", group.programs.map(p => `${p.program}  [${p.stage}]`).join("\n")),
          el("td", "mono muted", (group.does || []).join(" · ")))));
        add(inside, el("div", "muted", "everything that met the examples, by what it does beyond them"), table);
      }
    }));
  }
  if (code.timings) add(box, el("div", "muted", "seconds: " +
    Object.entries(code.timings).map(([k, v]) => `${k} ${v}`).join(" · ")));
  return box;
}

// -- everything a turn did: the inspector -------------------------------------
const VIA_COLOURS = { walk: "#7cc4ff", memory: "#3fb27f", said: "#e0a84a", run: "#b48cff",
                      project: "#4fd18b" };
let inspected = null;          // {sid, number}
const turnsSeen = [];          // numbers of this conversation's turns, as rendered

// The graph laid out by a few hundred steps of springs: nodes repel, edges
// pull, an is_a edge pulls its parent up. Small graphs, so O(n²) is fine.
function drawGraph(graph) {
  const nodes = (graph.nodes || []).map((n, i) => ({ ...n,
    x: 300 + 160 * Math.cos(i * 2.4), y: 170 + 110 * Math.sin(i * 2.4) }));
  const at = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edges = (graph.edges || []).filter(e => at[e.from] && at[e.to]);
  for (let step = 0; step < 400; step++) {
    const cool = 1 - step / 400;
    nodes.forEach(a => { a.dx = 0; a.dy = 0; });
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      const d2 = Math.max(dx * dx + dy * dy, 25);
      const f = 2600 / d2;
      dx *= f / Math.sqrt(d2); dy *= f / Math.sqrt(d2);
      a.dx += dx; a.dy += dy; b.dx -= dx; b.dy -= dy;
    }
    edges.forEach(e => {
      const a = at[e.from], b = at[e.to];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
      const f = (d - 95) * 0.04;
      a.dx += dx / d * f; a.dy += dy / d * f; b.dx -= dx / d * f; b.dy -= dy / d * f;
      if (e.relation === "is_a") { a.dy += 0.8; b.dy -= 0.8; }
    });
    nodes.forEach(n => {
      n.x += Math.max(-12, Math.min(12, n.dx)) * cool;
      n.y += Math.max(-12, Math.min(12, n.dy)) * cool;
    });
  }
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs, 0) - 70, maxX = Math.max(...xs, 0) + 70;
  const minY = Math.min(...ys, 0) - 30, maxY = Math.max(...ys, 0) + 30;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "graph");
  svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
  const make = (tag, attrs, text) => {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    if (text !== undefined) node.textContent = text;
    svg.appendChild(node);
    return node;
  };
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6877"/></marker>';
  svg.appendChild(defs);
  edges.forEach(e => {
    const a = at[e.from], b = at[e.to];
    const line = make("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      stroke: VIA_COLOURS[e.via] || "#5d6877", "stroke-opacity": 0.65,
      "stroke-width": e.via === "run" ? 1 : 1.6, "marker-end": "url(#arrow)",
      "stroke-dasharray": e.doubt ? "4 3" : "" });
    line.appendChild(Object.assign(document.createElementNS(NS, "title"),
      { textContent: `${e.from} —${e.relation}→ ${e.to} (${e.via})` +
        (e.confidence != null ? ` · ${e.confidence}` : "") + (e.source ? ` · ${e.source}` : "") +
        (e.doubt ? ` · doubted: ${e.doubt}` : "") + (e.how ? ` · ${e.how}` : "") }));
    make("text", { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 3, "text-anchor": "middle",
                   class: "edge-label" }, e.relation);
  });
  nodes.forEach(n => {
    const r = 6 + Math.min(10, 6 * (n.activation || 0));
    const circle = make("circle", { cx: n.x, cy: n.y, r,
      fill: VIA_COLOURS[n.via[0]] || "#768390", "fill-opacity": 0.85,
      stroke: n.individual ? "#ffffff" : "#0b0e13", "stroke-width": n.individual ? 2 : 1 });
    circle.appendChild(Object.assign(document.createElementNS(NS, "title"),
      { textContent: `${n.id}\nfrom: ${n.via.join(", ")}` +
        (n.rules ? `\nrules: ${n.rules.join(" ")}` : "") +
        (n.activation != null ? `\nactivation: ${n.activation}` : "") }));
    make("text", { x: n.x, y: n.y - r - 4, "text-anchor": "middle" }, n.label);
  });
  return svg;
}

function graphPanel(graph) {
  return panel("semantic graph", `${(graph.nodes || []).length} nodes, ${(graph.edges || []).length} edges`, true, inside => {
    if (!(graph.nodes || []).length) {
      inside.appendChild(el("div", "empty", "this turn touched no part of the graph"));
      return;
    }
    inside.appendChild(drawGraph(graph));
    const legend = el("div", "legend");
    Object.entries({ walk: "v687's walk", memory: "the conversation's individuals",
                     said: "what a phrase meant", run: "v688's loop (activation, doubts)" })

        const dot = el("i");
        dot.style.background = VIA_COLOURS[via];
        add(item, dot, document.createTextNode(said));
        legend.appendChild(item);
      });
    add(legend, el("span", null, "· white ring: an individual · dashed: doubted · bigger: more active · hover for more"));
    inside.appendChild(legend);

    add(table, add(el("tr"), el("th", null, "from"), el("th", null, "relation"),
