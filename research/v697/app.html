                         e.doubt ? "doubted: " + e.doubt : "", e.how || ""].filter(Boolean).join(" · ")))));

}

// Any value as a tree that opens: keys, values typed by colour, and a filter
// that keeps what matches open and the rest hidden.
function jsonTree(value, label, open) {
  const root = el("div", "jtree");
  const build = (key, item, depth) => {
    if (item !== null && typeof item === "object") {
      const entries = Array.isArray(item) ? item.map((v, i) => [i, v]) : Object.entries(item);
      const box = el("details");
      if (open && depth < 1) box.open = true;
      const head = el("summary");
      add(head, el("span", "k", String(key)),
          document.createTextNode(Array.isArray(item) ? ` [${entries.length}]` : ` {${entries.length}}`));
      box.appendChild(head);
      let built = false;
      const fill = () => {
        if (built) return;
        built = true;
        entries.forEach(([k, v]) => box.appendChild(build(k, v, depth + 1)));
      };
      if (box.open) fill();
      box.addEventListener("toggle", () => { if (box.open) fill(); });
      box._fill = fill;
      return box;
    }
    const leaf = el("div", "leaf");
    const cls = typeof item === "string" ? "v-s" : typeof item === "number" ? "v-n" : "v-b";
    add(leaf, el("span", "k", String(key)), document.createTextNode(": "),
        el("span", cls, typeof item === "string" ? JSON.stringify(item) : String(item)));
    return leaf;
  };
  root.appendChild(build(label || "turn", value, 0));
  return root;
}
// Open every branch holding a match, hide the leaves that do not.
function filterTree(root, needle) {
  const all = root.querySelectorAll("details");
  all.forEach(one => one._fill && one._fill());
  const want = needle.trim().toLowerCase();
  root.querySelectorAll(".hit").forEach(one => one.classList.remove("hit"));
  root.querySelectorAll(".leaf").forEach(leaf => {
    const on = !want || leaf.textContent.toLowerCase().includes(want);
    leaf.classList.toggle("hidden", !on);
    if (want && on) leaf.classList.add("hit");
  });
  [...root.querySelectorAll("details")].reverse().forEach(box => {
    const head = box.querySelector(":scope > summary");
    const own = head && head.textContent.toLowerCase().includes(want);
    const inner = box.querySelector(".leaf:not(.hidden), details:not(.hidden)");
    const on = !want || own || !!inner;
    box.classList.toggle("hidden", !on);
    if (want) box.open = on;
  });
}

function rawPanel(turn) {
  return panel("raw", "the turn as it was kept, whole — every field", false, inside => {
    const row = el("div", "search");
    const find = el("input");
    find.placeholder = "find in the turn (a word, a rule, a concept) …";
    const copy = el("button", "quiet", "⧉ copy JSON");
    const text = JSON.stringify(turn, null, 1);
    copy.addEventListener("click", async () => flash(copy, (await copyText(text)) ? "✓ copied" : "✗ not copied"));
    const save = el("button", "quiet", "⤓ .json");
    save.addEventListener("click", () => {
      const link = el("a");
      link.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      link.download = `turn-${turn.number}.json`;
      link.click();
    });
    add(row, find, copy, save);
    const tree = jsonTree(turn, `turn ${turn.number}`, true);
    let timer = null;
    find.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => filterTree(tree, find.value), 200);
    });
    add(inside, row, el("div", "muted", `${Math.round(text.length / 1024)} KB`), tree);
  });
}

async function inspect(number) {
  inspected = { sid: current.sid, number };
  pane.open = true;
  showTab("everything");
  layPane();
  const box = document.getElementById("tab-everything");
  box.textContent = "";
  const pick = el("div", "turnpick");
  turnsSeen.forEach(n => {
    const button = el("button", n === number ? "on" : "", `turn ${n}`);
    button.addEventListener("click", () => inspect(n));
    pick.appendChild(button);
  });
  add(box, pick, el("div", "pending", "fetching everything …"));
  let turn;
  try {
    turn = await getJSON(`/api/turn?sid=${encodeURIComponent(current.sid)}&n=${number}`);
  } catch (bad) {
    box.lastChild.remove();
    add(box, el("div", "note", `Not kept whole: ${bad.message}. Turns from before this ` +
        "server started are kept as the archive keeps them — their steps, not everything."));
    return;
  }
  box.lastChild.remove();
  const answer = turn.answer || {};
  add(box, el("h2", null, `turn ${turn.number} — “${turn.said}”`), kv([
    ["act", turn.act], ["answer", answer.text], ["outcome", answer.outcome],
    ["from", answer.source], ["said", (turn.reply || {}).text]]));
  box.appendChild(panel("steps", "the account, step by step", true, inside =>
    inside.appendChild(renderSteps(turn))));
  if (answer.code) box.appendChild(panel("code", "what solving the request came to", true, inside =>
    inside.appendChild(codePanel(answer.code))));
  box.appendChild(graphPanel(turn.graph || {}));
  box.appendChild(executivePanel(turn));
  if (turn.walk) box.appendChild(walkPanel(turn.walk));
  if (turn.run) box.appendChild(loopPanel(turn.run));
  if (turn.reading) box.appendChild(panel("reading", "what the encoder and the rules read", false,
    inside => inside.appendChild(jsonTree(turn.reading, "reading", true))));
  if (turn.memory) box.appendChild(panel("memory", "the conversation's memory after the turn", false,
    inside => inside.appendChild(jsonTree(turn.memory, "memory", true))));
  box.appendChild(rawPanel(turn));
  try {
    const held = await getJSON(`/api/project?sid=${encodeURIComponent(current.sid)}`);
    box.appendChild(projectPanel(held));
  } catch (_) { /* no project in this conversation, or a server without them */ }
}

// The project the editor sent: its size, and who calls whom -- the most
// connected functions drawn (a whole project is too many to lay out).
function projectPanel(held) {
  const s = held.summary || {};
  return panel("project", `${s.files} files, ${s.functions} functions, ${s.lines} lines`, false, inside => {
    add(inside, kv([["name", s.name], ["most called", (s["most called"] || []).map(([end, n]) =>
      `${end.split("#")[1]} (${n})`).join(", ")]]));
    const graph = held.graph || { nodes: [], edges: [] };
    const degree = {};
    graph.edges.forEach(e => { degree[e.from] = (degree[e.from] || 0) + 1; degree[e.to] = (degree[e.to] || 0) + 1; });
    const kept = new Set(Object.entries(degree).sort((a, b) => b[1] - a[1]).slice(0, 80).map(([id]) => id));
    inside.appendChild(drawGraph({
      nodes: graph.nodes.filter(n => kept.has(n.id)),
      edges: graph.edges.filter(e => kept.has(e.from) && kept.has(e.to)) }));
    add(inside, el("div", "muted", `${kept.size} of ${graph.nodes.length} functions drawn: those with the most calls in or out`));
    inside.appendChild(jsonTree(held.outline || {}, "outline"));
  });
}

// -- tabs, examples, history ------------------------------------------------
function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(one =>
    one.classList.toggle("on", one.dataset.tab === name));
  ["episodic", "longterm", "senses", "everything"].forEach(tab =>
    document.getElementById("tab-" + tab).hidden = tab !== name);
  if (name === "longterm") renderLongterm();
  syncRail();
}
document.querySelectorAll(".tabs button").forEach(button => {
  button.addEventListener("click", () => showTab(button.dataset.tab));
});

// -- the pane: open or closed, and 30-60% of the page wide -------------------
const PANE = { min: 30, max: 60, step: 5 };
const pane = { open: true, width: 42 };
try {
  const kept = JSON.parse(localStorage.getItem("v690-pane") || "null");
  if (kept && typeof kept.open === "boolean") pane.open = kept.open;
  if (kept && Number.isFinite(kept.width)) pane.width = kept.width;
} catch (_) { /* the default pane */ }

function shownTab() {
  const on = document.querySelector(".tabs button.on");
  return on ? on.dataset.tab : "episodic";
}
function layPane() {
  pane.width = Math.min(PANE.max, Math.max(PANE.min, Math.round(pane.width)));
  const main = document.querySelector("main");
  main.style.setProperty("--pane", pane.width + "%");
  main.classList.toggle("closed", !pane.open);
  syncRail();
  try {
    localStorage.setItem("v690-pane", JSON.stringify(pane));
  } catch (_) { /* not kept */ }
}
function syncRail() {
  const tab = shownTab();
  document.querySelectorAll("#rail [data-open]").forEach(one =>
    one.classList.toggle("on", pane.open && one.dataset.open === tab));
  const toggle = document.getElementById("toggle");
  toggle.innerHTML = pane.open ? "&#8250;" : "&#8249;";
  toggle.title = pane.open ? "close the pane" : "open the pane";
  document.getElementById("wider").disabled =
    !pane.open || pane.width >= PANE.max;
  document.getElementById("narrower").disabled =
    !pane.open || pane.width <= PANE.min;
  document.getElementById("pct").textContent =
    pane.open ? pane.width + "%" : "";
}
// A tab's button opens the pane on it; the open tab's button closes it.
document.querySelectorAll("#rail [data-open]").forEach(button => {
  button.addEventListener("click", () => {
    const name = button.dataset.open;
    if (pane.open && shownTab() === name) {
      pane.open = false;
    } else {
      pane.open = true;
      showTab(name);
    }
    layPane();
  });
});
document.getElementById("toggle").addEventListener("click", () => {
  pane.open = !pane.open;
  layPane();
});
document.getElementById("wider").addEventListener("click", () => {
  pane.width = Math.floor(pane.width / PANE.step) * PANE.step + PANE.step;
  layPane();
});
document.getElementById("narrower").addEventListener("click", () => {
  pane.width = Math.ceil(pane.width / PANE.step) * PANE.step - PANE.step;
  layPane();
});
document.getElementById("grip").addEventListener("pointerdown", event => {
  const main = document.querySelector("main");
  const grip = event.currentTarget;
  const rail = document.getElementById("rail").getBoundingClientRect().width;
  grip.setPointerCapture(event.pointerId);
  main.classList.add("dragging");
  const move = moved => {
    const box = main.getBoundingClientRect();
    pane.width = (box.right - rail - moved.clientX) / box.width * 100;
    layPane();
  };
  const stop = () => {
    main.classList.remove("dragging");
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", stop);
    grip.removeEventListener("pointercancel", stop);
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", stop);
  grip.addEventListener("pointercancel", stop);
});
layPane();

function renderMode() {
  const box = document.getElementById("mode");
  box.textContent = "";
  if (current.example) {
    add(box, document.createTextNode("example: "), el("b", null, current.title),
        document.createTextNode(" · a conversation of its own; nothing it teaches is kept for others"));
    const back = el("button", "quiet", "back to your conversation");
    back.addEventListener("click", () => { if (!busy) open(SID, false); });
    box.appendChild(back);
  } else {
    add(box, el("b", null, "your conversation"),
        document.createTextNode(" · kept across restarts; kinds you teach are kept for every conversation"));
  }
}

async function forget() {
  await getJSON(`/api/forget?sid=${encodeURIComponent(current.sid)}`);
  document.getElementById("transcript").textContent = "";
  turnsSeen.length = 0;
  lastTurn = null;
  lastSaid = "";
  renderMemory(null);
  renderSenses([], {});
}

async function open(sid, example, title) {
  current = { sid, example, title: title || "" };
  renderMode();
  document.getElementById("transcript").textContent = "";
  turnsSeen.length = 0;
  if (!example) document.getElementById("shows").textContent = "";
  try {
    const history = await getJSON(`/api/history?sid=${encodeURIComponent(sid)}`);
    const turns = history.turns || [];
    turns.forEach(turn => renderTurn(turn, transcriptBox()));
    const last = turns[turns.length - 1] || null;
    lastTurn = last;
    lastSaid = last ? last.said : "";
    renderMemory(history.memory ? history : null);
    renderSenses((last && last.senses) || [], history.pins || {});
    scrollDown();
  } catch (_) {
    renderMemory(null);
    renderSenses([], {});
  }
}

async function play(example) {
  if (busy) return;
  busy = true;
  document.getElementById("shows").textContent = example.shows;
  current = { sid: EXAMPLE_SID, example: true, title: example.title };
  renderMode();
  await forget();
  for (const line of example.lines) await say(line);
  busy = false;
}

document.getElementById("say").addEventListener("submit", async event => {
  event.preventDefault();
  const input = document.getElementById("line");
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  busy = true;
  await say(text);
  busy = false;
  input.focus();
});
document.getElementById("forget").addEventListener("click", () => { if (!busy) forget(); });
const LINE = document.getElementById("line");
function fitLine() {
  LINE.style.height = "auto";
  LINE.style.height = Math.min(LINE.scrollHeight + 2, 220) + "px";
  LINE.classList.toggle("code-ish", codeIsh(LINE.value));
}
LINE.addEventListener("input", fitLine);
LINE.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    document.getElementById("say").requestSubmit();
  }
});
document.getElementById("say").addEventListener("submit", () => setTimeout(fitLine, 0));
// Requests for code to try: put in the box, to be read and changed first.
const CODE_EXAMPLES = [
  ["code: reverse the words", 'reverse the words of a sentence\nfunction reverseWords(s: string): string\nreverseWords("a b c") == "c b a"\nreverseWords("hello world") == "world hello"'],
  ["code: sum a list", "sum a list of numbers\ntotal([1, 2, 3]) == 6\ntotal([]) == 0\ntotal([5]) == 5"],
  ["code: count vowels", 'count the vowels in a string\nvowels("hello") == 2\nvowels("sky") == 0\nvowels("AEIOU") == 5'],
];

(async () => {
  // the server's own name in the heading: a later server serves this page
  try {
    const health = await getJSON("/api/health");
    if (health.server) document.querySelector("header h1").textContent = health.server.toUpperCase();
  } catch (_) { /* a server without /api/health: v697 */ }
  const { examples } = await getJSON("/api/examples");
  const row = document.getElementById("examples");
  examples.forEach(example => {
    const button = el("button", null, example.title);
    button.title = example.lines.join(" / ");
    button.addEventListener("click", () => play(example));
    row.appendChild(button);
  });
  CODE_EXAMPLES.forEach(([title, text]) => {
    const button = el("button", null, title);
    button.title = "put it in the box: read it, change it, say it";
    button.addEventListener("click", () => { LINE.value = text; fitLine(); LINE.focus(); });
    row.appendChild(button);
  });
  await open(SID, false);
})();
</script>
